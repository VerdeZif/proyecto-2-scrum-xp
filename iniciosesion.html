<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia tu Sesion</title>
</head>
<body>
    <div id="barra"></div>
    <div class="correo-contenido">
        <h2>Iniciar Sesión</h2>
        <form action="inicio.html" method="post">
            <label for="correo">Correo:</label>
            <input type="text" id="correo" name="correo" placeholder="Ingresa el correo" required>
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" placeholder="Ingresa tu contraseña" required>
            <div class="remember-me">
                <input type="checkbox" id="recordarme" name="recordarme">
                <label for="recordarme">Recordarme</label>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
    <div id="copyright"></div>
</body>
</html>
